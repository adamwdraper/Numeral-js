name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read
  statuses: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Run tests
        run: npm test

  travis-compat:
    runs-on: ubuntu-latest
    needs: test
    if: ${{ always() }}
    steps:
      - name: Publish legacy Travis status context
        uses: actions/github-script@v7
        with:
          script: |
            const result = '${{ needs.test.result }}';
            const state = result === 'success' ? 'success' : 'failure';
            const description = result === 'success'
              ? 'GitHub Actions matrix passed'
              : `GitHub Actions matrix result: ${result}`;
            const targetUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const shas = new Set([context.sha]);

            if (context.payload.pull_request && context.payload.pull_request.head && context.payload.pull_request.head.sha) {
              shas.add(context.payload.pull_request.head.sha);
            }

            for (const sha of shas) {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha,
                state,
                context: 'continuous-integration/travis-ci',
                description,
                target_url: targetUrl
              });
            }
